<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký tài khoản - ShopVN</title>

    <style>
        body {
            margin: 0;
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
            color: #333333;
        }

        main {
            width: 700px;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        section h1 {
            text-align: center;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        fieldset {
            margin-bottom: 10px;
            border: 1px solid #999999;
            border-radius: 4px;
            background-color: #f0f8f8;
        }

        legend {
            font-size: 14px;
            font-weight: bold;
            color: #333333;
            padding: 0 7px;
        }

        .dong {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }

        label {
            width: 180px;
            font-size: 13px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="url"],
        input[type="number"],
        input[type="search"],
        input[type="date"] {
            width: 300px;
            height: 25px;
            box-sizing: border-box;
            border: 1px solid #aaaaaa;
            border-radius: 3px;
            padding: 4px 7px;
        }

        input[type="range"] {
            width: 300px;
        }

        input[type="color"] {
            width: 45px;
            height: 25px;
        }

        .radio,
        .checkbox {
            font-size: 13px;
        }

        .radio input,
        .checkbox input {
            margin-right: 4px;
        }

        input[type="file"] {
            font-size: 12px;
        }

        .nut {
            text-align: center;
            margin-top: 15px;
        }

        input[type="submit"],
        input[type="reset"] {
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }

        input[type="submit"] {
            background-color: #147dcc;
            color: white;
        }

        input[type="reset"] {
            background-color: #999999;
            color: white;
            margin-left: 5px;
        }

        input[type="submit"]:hover {
            background-color: #0965aa;
        }

        input[type="reset"]:hover {
            background-color: #777777;
        }
    </style>
</head>

<body>

    <main>

        <section>

            <h1>Đăng ký tài khoản mới</h1>

            <form <form action="#"
                method="POST"
                enctype="multipart/form-data"
                name="formDangKy"
                id="formDangKy"
                onsubmit="dangKyThanhCong(event)">

                <!-- THÔNG TIN CƠ BẢN -->
                <fieldset>

                    <legend>Thông tin cơ bản</legend>

                    <div class="dong">
                        <label for="hoten">Họ và tên:</label>

                        <input type="text"
                               name="hoten"
                               id="hoten"
                               placeholder="Nguyễn Văn An"
                               required
                               maxlength="100">
                    </div>

                    <div class="dong">
                        <label for="email">Email:</label>

                        <input type="email"
                               name="email"
                               id="email"
                               placeholder="example@gmail.com"
                               required>
                    </div>

                    <div class="dong">
                        <label for="matkhau">Mật khẩu:</label>

                        <input type="password"
                               name="matkhau"
                               id="matkhau"
                               minlength="8"
                               required>
                    </div>

                    <div class="dong">
                        <label for="sdt">Số điện thoại:</label>

                        <input type="tel"
                               name="sdt"
                               id="sdt"
                               pattern="[0-9]{10}"
                               placeholder="0901234567">
                    </div>

                </fieldset>


                <!-- THÔNG TIN CÁ NHÂN -->
                <fieldset>

                    <legend>Thông tin cá nhân</legend>

                    <div class="dong">
                        <label for="tuoi">Tuổi:</label>

                        <input type="number"
                               name="tuoi"
                               id="tuoi"
                               min="16"
                               max="99"
                               step="1"
                               value="18">
                    </div>

                    <div class="dong">
                        <label for="ngaysinh">Ngày sinh:</label>

                        <input type="date"
                               name="ngaysinh"
                               id="ngaysinh"
                               min="1950-01-01"
                               max="2010-12-31">
                    </div>

                    <div class="dong">
                        <label>Giới tính:</label>

                        <span class="radio">
                            <input type="radio"
                                   name="gioitinh"
                                   value="nam">
                            Nam

                            <input type="radio"
                                   name="gioitinh"
                                   value="nu">
                            Nữ

                            <input type="radio"
                                   name="gioitinh"
                                   value="khac">
                            Khác
                        </span>
                    </div>

                    <div class="dong">
                        <label for="mauua">Màu yêu thích:</label>

                        <input type="color"
                               name="mauua"
                               id="mauua"
                               value="#FF6B6B">
                    </div>

                </fieldset>


                <!-- SỞ THÍCH & CÀI ĐẶT -->
                <fieldset>

                    <legend>Sở thích & Cài đặt</legend>

                    <div class="dong">
                        <label for="soikim">Tìm kiếm sở thích:</label>

                        <input type="search"
                               name="soikim"
                               id="soikim"
                               placeholder="Ví dụ: đọc sách, chơi game...">
                    </div>

                    <div class="dong">
                        <label for="chitieu">
                            Mức chi tiêu/tháng (VNĐ):
                        </label>

                        <input type="range"
                               name="chitieu"
                               id="chitieu"
                               min="0"
                               max="50000000"
                               step="500000"
                               value="5000000">
                    </div>

                    <div class="dong">
                        <label>Sở thích (chọn nhiều):</label>

                        <span class="checkbox">

                            <input type="checkbox"
                                   name="st_docsinh"
                                   value="doc">
                            Đọc sách

                            <input type="checkbox"
                                   name="st_game"
                                   value="game">
                            Chơi game

                            <input type="checkbox"
                                   name="st_du_lich"
                                   value="dulich">
                            Du lịch

                        </span>
                    </div>

                    <div class="dong">
                        <label for="website">Website cá nhân:</label>

                        <input type="url"
                               name="website"
                               id="website"
                               placeholder="https://example.com">
                    </div>

                    <div class="dong">
                        <label for="avatar">Ảnh đại diện:</label>

                        <input type="file"
                               name="avatar"
                               id="avatar"
                               accept="image/png, image/jpeg">
                    </div>

                </fieldset>


                <!-- NÚT -->
                <div class="nut">

                    <input type="submit"
                           value="Đăng ký ngay">

                    <input type="reset"
                           value="Nhập lại">

                </div>

            </form>

        </section>

    </main>
    <script>
    function dangKyThanhCong(event) {
        event.preventDefault();
        alert("Đăng ký thành công!");
    }
    </script>

</body>

</html>
